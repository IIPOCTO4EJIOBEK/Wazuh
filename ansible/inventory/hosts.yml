---
# =====================================================================
#  Инвентарь стенда Wazuh. Сегмент мониторинга 10.5.2.0/24 — там же,
#  где Zabbix (10.5.2.74).
#
#  Схема резервирования:
#    индексер   — 3 узла, кворум 2 из 3, 1 реплика каждого шарда;
#    менеджер   — master + worker, общий client.keys и правила;
#    дашборд    — 2 узла за VIP;
#    балансир   — 2 узла keepalived, два VIP (агенты и дашборд).
#
#  Уменьшенный вариант (если 9 ВМ выделить нельзя) описан в
#  docs/02-sizing.md, раздел «Минимальная конфигурация».
# =====================================================================

all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3

  children:

    # -----------------------------------------------------------------
    # Индексер: хранение и поиск. Все три узла — data + master-eligible.
    # -----------------------------------------------------------------
    wazuh_indexer:
      hosts:
        wazuh-idx-01:
          ansible_host: 10.5.2.81
          indexer_node_name: wazuh-idx-01
        wazuh-idx-02:
          ansible_host: 10.5.2.82
          indexer_node_name: wazuh-idx-02
        wazuh-idx-03:
          ansible_host: 10.5.2.83
          indexer_node_name: wazuh-idx-03

    # -----------------------------------------------------------------
    # Менеджеры: приём событий, анализ, active response, API.
    # Регистрация агентов (authd) работает только на master.
    # -----------------------------------------------------------------
    wazuh_manager:
      hosts:
        wazuh-mgr-01:
          ansible_host: 10.5.2.85
          manager_node_name: wazuh-mgr-01
          manager_node_type: master
        wazuh-mgr-02:
          ansible_host: 10.5.2.86
          manager_node_name: wazuh-mgr-02
          manager_node_type: worker

    wazuh_manager_master:
      hosts:
        wazuh-mgr-01:
          ansible_host: 10.5.2.85

    # -----------------------------------------------------------------
    # Дашборды
    # -----------------------------------------------------------------
    wazuh_dashboard:
      hosts:
        wazuh-dash-01:
          ansible_host: 10.5.2.88
        wazuh-dash-02:
          ansible_host: 10.5.2.89

    # -----------------------------------------------------------------
    # Балансировщики: HAProxy + keepalived.
    # lb-01 — MASTER по обоим VIP, lb-02 — BACKUP.
    # -----------------------------------------------------------------
    wazuh_lb:
      hosts:
        wazuh-lb-01:
          ansible_host: 10.5.2.92
          keepalived_state: MASTER
          keepalived_priority: 150
        wazuh-lb-02:
          ansible_host: 10.5.2.93
          keepalived_state: BACKUP
          keepalived_priority: 100

    # -----------------------------------------------------------------
    # Агенты на Linux. Группы соответствуют группам агентов в Wazuh
    # (rules/agent-groups/*.conf) — от группы зависит набор проверок.
    # -----------------------------------------------------------------
    wazuh_agents_linux:
      children:
        agents_bitrix:
          hosts:
            web01:
              ansible_host: 10.0.1.220
            web02:
              ansible_host: 10.0.1.221
            b24-web-01:
              ansible_host: 10.0.2.31
          vars:
            wazuh_agent_groups: "default,linux,bitrix-web"

        agents_db:
          hosts:
            bitrix-db-01:
              ansible_host: 10.1.17.120
            bitrix-db-02:
              ansible_host: 10.1.17.121
          vars:
            wazuh_agent_groups: "default,linux,database"

        agents_edge:
          hosts:
            haproxy-01:
              ansible_host: 10.0.1.50
            npm-01:
              ansible_host: 10.0.1.110
          vars:
            wazuh_agent_groups: "default,linux,dmz"

        agents_infra:
          hosts:
            zabbix-01:
              ansible_host: 10.5.2.74
            backup-01:
              ansible_host: 10.1.222.81
          vars:
            wazuh_agent_groups: "default,linux"

    # -----------------------------------------------------------------
    # Агенты Windows разворачиваются через GPO, а не через Ansible —
    # см. docs/06-agents.md и agents/windows/Install-WazuhAgent.ps1.
    # Здесь перечислены только те узлы, за которыми нужен отдельный
    # контроль при приёмке.
    # -----------------------------------------------------------------
    windows_reference:
      hosts:
        pdc-hv0:
          ansible_host: 10.2.27.118
          wazuh_agent_groups: "default,windows,hyperv"
        pdc-db1:
          ansible_host: 10.1.20.41
          wazuh_agent_groups: "default,windows,mssql"
