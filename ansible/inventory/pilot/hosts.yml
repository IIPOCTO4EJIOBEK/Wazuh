---
# =====================================================================
#  Инвентарь ПИЛОТА. Одна машина, отказоустойчивости нет — сознательно.
#
#  Задача пилота: убедиться, что события Active Directory и Bitrix
#  доходят, разбираются правилами и дают осмысленную картину. Проверять
#  это на кластере из девяти машин незачем: топология на состав правил
#  не влияет, а сроки согласования железа — влияют.
#
#  Отказоустойчивая схема: inventory/hosts.yml.
#  Переход с пилота на неё описан в docs/14-pilot.md.
#
#  Запуск:
#      ansible-playbook -i inventory/hosts-pilot.yml site.yml --ask-vault-pass
#
#  Адрес машины подставляется после того, как Валерий выдаст ВМ.
# =====================================================================

all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3

  children:

    # -----------------------------------------------------------------
    # Один узел во всех ролях сразу: индексер, менеджер, дашборд.
    # Роли не конфликтуют — они слушают разные порты и работают под
    # разными учётными записями.
    # -----------------------------------------------------------------
    wazuh_indexer:
      hosts:
        wazuh-pilot:
          ansible_host: 10.3.251.40      # уточнить у Валерия
          indexer_node_name: wazuh-pilot

    wazuh_manager:
      hosts:
        wazuh-pilot:
          ansible_host: 10.3.251.40
          manager_node_name: wazuh-pilot
          manager_node_type: master

    wazuh_manager_master:
      hosts:
        wazuh-pilot:
          ansible_host: 10.3.251.40

    wazuh_dashboard:
      hosts:
        wazuh-pilot:
          ansible_host: 10.3.251.40

    # Балансировщиков в пилоте нет: одну машину балансировать не между
    # чем. Группа объявлена пустой, чтобы плейбуки не искали её.
    wazuh_lb:
      hosts: {}

    # -----------------------------------------------------------------
    # Источники событий пилота.
    #
    # Контроллеры домена: агент ставится на две машины — это несравнимо
    # с раскаткой на 400 и сохраняет работу правил 100300–100399,
    # которым нужны поля журнала Windows. Если принято решение идти
    # только через syslog, см. docs/14-pilot.md, раздел о потере полей.
    # -----------------------------------------------------------------
    wazuh_agents_linux:
      children:
        agents_bitrix:
          hosts:
            web01:
              ansible_host: 10.0.1.220
            web02:
              ansible_host: 10.0.1.221
          vars:
            wazuh_agent_groups: "default,linux,bitrix-web"
