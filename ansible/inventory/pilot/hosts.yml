---
# =====================================================================
#  Инвентарь ПИЛОТА. Одна машина, отказоустойчивости нет — сознательно.
#
#  Стенд: 10.17.1.252, имя узла wazush, кластер wazuh-ahp.
#  Индексер, менеджер и дашборд — на одном хосте.
#
#  Отказоустойчивая схема: inventory/hosts.yml.
#  Переход с пилота на неё описан в docs/14-pilot.md.
#
#  Запуск (с самой машины пилота, соединение локальное):
#      ansible-playbook -i inventory/pilot/hosts.yml site.yml --ask-vault-pass
#
#  ---------------------------------------------------------------------
#  ПОЧЕМУ ВСЁ ВЛОЖЕНО В ГРУППУ `pilot`
#
#  Из-за порядка приоритетов переменных в Ansible. По возрастанию:
#      3. переменные групп в самом файле инвентаря  (all: vars:)
#      4. inventory group_vars/all
#      5. playbook  group_vars/all      ← ansible/group_vars/all.yml
#      6. inventory group_vars/<группа> ← сюда и кладём пилотные
#      8. переменные хоста в файле инвентаря
#
#  То есть боевой ansible/group_vars/all.yml перебивает и `all: vars:`
#  этого файла, и соседний group_vars/all.yml. Пилот молча получил бы
#  3 шарда, реплику и чужой адрес VIP. Переменные группы (уровень 6)
#  боевые значения перекрывают и действуют на все хосты инвентаря,
#  включая узлы с агентами.
#
#  Проверить, что применились пилотные значения:
#      ansible -i inventory/pilot/hosts.yml wazush \
#              -m debug -a "var=indexer_alerts_replicas"     # ждём 0
#      ansible -i inventory/pilot/hosts.yml web01 \
#              -m debug -a "var=wazuh_vip_agents"            # ждём 10.17.1.252
#  ---------------------------------------------------------------------
# =====================================================================

all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3

  children:

    pilot:
      children:

        # -------------------------------------------------------------
        # Один узел во всех ролях сразу. Роли не конфликтуют: разные
        # порты и разные системные учётные записи.
        # -------------------------------------------------------------
        wazuh_indexer:
          hosts:
            wazush:
              ansible_host: 10.17.1.252
              ansible_connection: local
              indexer_node_name: wazush

        wazuh_manager:
          hosts:
            wazush:
              ansible_host: 10.17.1.252
              manager_node_name: wazush
              manager_node_type: master

        wazuh_manager_master:
          hosts:
            wazush:
              ansible_host: 10.17.1.252

        wazuh_dashboard:
          hosts:
            wazush:
              ansible_host: 10.17.1.252

        # Балансировщиков в пилоте нет: одну машину балансировать не
        # между чем. Группа объявлена пустой, чтобы плейбуки её нашли.
        wazuh_lb:
          hosts: {}

        # -------------------------------------------------------------
        # Источники событий пилота.
        #
        # Контроллеры домена в этот список не входят: агент туда
        # ставится вручную, с самих машин — см. docs/14-pilot.md.
        # -------------------------------------------------------------
        wazuh_agents_linux:
          children:
            agents_bitrix:
              hosts:
                web01:
                  ansible_host: 10.0.1.220
                web02:
                  ansible_host: 10.0.1.221
              vars:
                wazuh_agent_groups: "default,linux,bitrix-web"

            agents_asterisk:
              hosts:
                asterisk-01:
                  ansible_host: 10.1.10.111
                  ansible_user: vardo001
              vars:
                wazuh_agent_groups: "default,linux,asterisk"
