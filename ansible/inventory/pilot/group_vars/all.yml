---
# =====================================================================
#  Переопределения для ПИЛОТА.
#
#  Файл лежит рядом с inventory/hosts-pilot.yml и применяется только
#  при запуске с этим инвентарём:
#      ansible-playbook -i inventory/hosts-pilot.yml site.yml
#
#  Переменные из ../group_vars/all.yml остаются в силе; здесь только то,
#  что отличается у одноузловой установки.
# =====================================================================

# ---------------------------------------------------------------------
# Пути
# ---------------------------------------------------------------------
# Инвентарь пилота лежит на уровень глубже боевого, поэтому путь до
# корня репозитория (правила, скрипты, дашборды) считается иначе.
wazuh_content_dir: "{{ inventory_dir }}/../../.."

# ---------------------------------------------------------------------
# Хранение: реплик нет и быть не может
# ---------------------------------------------------------------------
# На одном узле реплика разместиться не на чем. Оставить 1 — значит
# навсегда получить состояние yellow и приучить дежурного его не замечать.
indexer_alerts_shards: 1
indexer_alerts_replicas: 0

# Куча вдвое меньше: на одной машине память делят индексер и менеджер.
indexer_heap_size: "6g"

# Пилот короткий, годовое хранение ему не нужно.
ism_hot_days: 3
ism_warm_days: 14
ism_cold_days: 45
ism_delete_days: 90

# ---------------------------------------------------------------------
# Приём syslog
#
# Так в пилот заходят системы, на которые агент не ставится.
# Протокол TCP: syslog по UDP теряет события молча и подделывается
# кем угодно в сети.
# ---------------------------------------------------------------------
syslog_reception_enabled: true
syslog_port: 514
syslog_protocol: tcp

# Кто именно имеет право слать. Список закрытый: открытый порт syslog
# принимает выдуманные события от любого узла сети.
syslog_allowed_senders:
  - "10.3.251.0/24"      # серверная Москвы, куда сходятся журналы
  - "10.0.2.0/24"        # сеть контроллеров домена
  - "10.0.1.0/24"        # веб-кластер Bitrix
  - "10.1.17.0/24"       # Черноерковская — уточнить состав

# ---------------------------------------------------------------------
# Резервирование в пилоте
# ---------------------------------------------------------------------
# Снапшоты в пилоте на общее хранилище не делаются: NFS-ресурса под него
# ещё нет, а снапшот на локальный диск той же машины защищает только от
# ошибочного удаления индекса, но не от потери машины.
# Проверочный снапшот при развёртывании отключён, чтобы установка
# не падала из-за отсутствия репозитория.
snapshot_verify_on_deploy: false

# Конфигурация менеджера копируется локально и выгружается наружу —
# это работает и на одной машине, и это главное, что стоит сохранить:
# правила и ключи агентов.
offsite_enabled: true
config_backup_keep_days: 30

# ---------------------------------------------------------------------
# Оповещение в пилоте
# ---------------------------------------------------------------------
# Заявки в ServiceDesk Plus на время пилота не создаются: правила ещё
# настраиваются, и поток ложных срабатываний забьёт очередь поддержки.
# Включить после недели наблюдения за фактическим потоком.
servicedesk_enabled: false

# Почта и Zabbix работают сразу: они нужны, чтобы заметить, что пилот
# сам перестал работать.
smtp_enabled: true
zabbix_enabled: true

# ---------------------------------------------------------------------
# Самопроверка правил
# ---------------------------------------------------------------------
# Остаётся включённой: пилот и нужен для того, чтобы понять, работают ли
# правила на настоящих событиях.
wazuh_rules_selftest: true
