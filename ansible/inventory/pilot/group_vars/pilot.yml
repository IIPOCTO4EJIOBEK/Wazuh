---
# =====================================================================
#  Переменные ПИЛОТА.
#
#  Здесь только то, что отличается от боевой схемы
#  (ansible/group_vars/all.yml). Остальное берётся оттуда — копировать
#  весь файл не нужно и вредно: копии расходятся.
#
#  Файл назван по имени группы `pilot`, а не `all`, намеренно: только
#  переменные конкретной группы перекрывают боевой group_vars/all.yml.
#  Подробности — в шапке hosts.yml.
# =====================================================================

# ---------------------------------------------------------------------
# Пути
# ---------------------------------------------------------------------
# Инвентарь пилота лежит на уровень глубже боевого, поэтому путь до
# корня проекта (правила, скрипты, дашборды) считается иначе.
wazuh_content_dir: "{{ inventory_dir }}/../../.."

# ---------------------------------------------------------------------
# Адреса: балансировщиков нет, всё указывает на саму машину
# ---------------------------------------------------------------------
# Эти значения нужны не только узлу пилота, но и узлам с агентами:
# по wazuh_vip_agents агент регистрируется и отправляет события.
wazuh_vip_agents: "10.17.1.252"
wazuh_vip_dashboard: "10.17.1.252"
wazuh_agents_fqdn: "10.17.1.252"
wazuh_dashboard_fqdn: "10.17.1.252"
dashboard_server_name: "10.17.1.252"

# ---------------------------------------------------------------------
# Хранение: реплик нет и быть не может
# ---------------------------------------------------------------------
# На одном узле реплике негде разместиться. Оставить 1 — значит навсегда
# получить состояние yellow и приучить дежурного его не замечать.
indexer_alerts_shards: 1
indexer_alerts_replicas: 0

# Куча вдвое меньше: на одной машине память делят индексер и менеджер.
indexer_heap_size: "6g"

# Пилот короткий, годовое хранение ему не нужно.
ism_hot_days: 3
ism_warm_days: 14
ism_cold_days: 45
ism_delete_days: 90

# ---------------------------------------------------------------------
# Приём syslog
# ---------------------------------------------------------------------
# Для источников, куда агент поставить нельзя: MikroTik, обратный
# прокси, сетевое оборудование. Active Directory и Bitrix идут агентом.
syslog_reception_enabled: true
syslog_port: 514
syslog_protocol: tcp

syslog_allowed_senders:
  - "10.17.1.0/24"       # сеть пилота
  - "10.0.2.0/24"        # сеть контроллеров домена
  - "10.0.1.0/24"        # веб-кластер Bitrix
  - "10.1.10.0/24"       # телефония

# ---------------------------------------------------------------------
# Резервирование
# ---------------------------------------------------------------------
# Общего хранилища снапшотов у пилота нет — проверочный снапшот при
# развёртывании пропускается, чтобы установка не падала.
snapshot_verify_on_deploy: false

offsite_enabled: true
config_backup_keep_days: 30

# ---------------------------------------------------------------------
# Оповещение
# ---------------------------------------------------------------------
# Заявки в ServiceDesk на время пилота не создаются: правила ещё
# настраиваются, поток ложных срабатываний забьёт очередь поддержки.
servicedesk_enabled: false

# Почта и Zabbix — с первого дня: пилот должен уметь сообщить, что он
# сам перестал работать.
smtp_enabled: true
zabbix_enabled: true

# Самопроверка правил остаётся включённой: пилот и нужен для того,
# чтобы понять, работают ли правила на настоящих событиях.
wazuh_rules_selftest: true
