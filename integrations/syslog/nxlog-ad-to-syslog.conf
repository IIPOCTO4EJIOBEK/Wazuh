## =====================================================================
##  Пересылка журнала безопасности контроллеров домена.
##  Ответственный: Дулепов
##
##  Применяется, ТОЛЬКО если принято решение не ставить агент Wazuh и не
##  разворачивать сбор событий Windows (WEF). Прежде чем использовать
##  этот файл, прочитайте docs/14-pilot.md, раздел «Три пути завернуть
##  Active Directory» — здесь теряются поля, на которых построены
##  правила 100300–100399.
##
##  Установка на каждом контроллере домена:
##      1. Поставить NXLog Community Edition
##      2. Заменить C:\Program Files\nxlog\conf\nxlog.conf этим файлом
##      3. net stop nxlog && net start nxlog
##      4. Проверить C:\Program Files\nxlog\data\nxlog.log
## =====================================================================

define ROOT     C:\Program Files\nxlog
define COLLECTOR 10.3.251.40
define PORT     514

Moduledir %ROOT%\modules
CacheDir  %ROOT%\data
Pidfile   %ROOT%\data\nxlog.pid
SpoolDir  %ROOT%\data
LogFile   %ROOT%\data\nxlog.log
LogLevel  INFO

<Extension json>
    Module      xm_json
</Extension>

<Extension syslog>
    Module      xm_syslog
</Extension>

## ---------------------------------------------------------------------
## Источник: журнал безопасности с фильтром по идентификаторам.
##
## Фильтр обязателен. Журнал Security на контроллере домена порождает
## тысячи событий в секунду; отправлять его целиком означает забить
## канал до Москвы и утопить приёмник. Список совпадает с тем, что
## читает агент в rules/agent-groups/windows.conf и dc.conf.
## ---------------------------------------------------------------------
<Input eventlog>
    Module      im_msvistalog

    <QueryXML>
        <QueryList>
            <Query Id="0">
                <Select Path="Security">
                    *[System[
                        (EventID=4624 or EventID=4625 or EventID=4634 or
                         EventID=4648 or EventID=4656 or EventID=4663 or
                         EventID=4672 or EventID=4688 or EventID=4697 or
                         EventID=4719 or EventID=4720 or EventID=4722 or
                         EventID=4723 or EventID=4724 or EventID=4725 or
                         EventID=4726 or EventID=4728 or EventID=4732 or
                         EventID=4738 or EventID=4740 or EventID=4756 or
                         EventID=4767 or EventID=4768 or EventID=4769 or
                         EventID=4771 or EventID=4776 or EventID=4964 or
                         EventID=1102 or EventID=4662 or EventID=5136 or
                         EventID=5137 or EventID=5141)
                    ]]
                </Select>
                <Select Path="System">*</Select>
                <Select Path="Directory Service">*</Select>
            </Query>
        </QueryList>
    </QueryXML>

    ## Событие уезжает как JSON: так сохраняются имена полей.
    ## Без этого в Wazuh придёт одна строка текста, и разобрать
    ## учётную запись или адрес источника будет нечем.
    Exec $Message = to_json();
</Input>

## ---------------------------------------------------------------------
## Отправка. TCP с буфером на диске: при обрыве канала события
## накапливаются, а не теряются.
## ---------------------------------------------------------------------
<Output collector>
    Module      om_tcp
    Host        %COLLECTOR%
    Port        %PORT%

    ## Ограничение потока: если контроллер вдруг начнёт выдавать
    ## всплеск, он не должен положить приёмник.
    Exec        to_syslog_bsd();
</Output>

<Route eventlog_to_collector>
    Path        eventlog => collector
</Route>
