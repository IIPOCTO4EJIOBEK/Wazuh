<!--
  Группа mssql — PDC-DB1 (10.1.20.41).

  Мониторинг MSSQL уже настроен в Zabbix (шаблон MSSQL by Zabbix agent 2),
  и дублировать метрики производительности здесь незачем. Задача Wazuh
  другая: доступ к данным, изменения прав и попытки выполнить команды
  операционной системы из СУБД.
-->
<agent_config os="Windows">

  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[Provider[@Name='MSSQLSERVER'] or Provider[@Name='SQLSERVERAGENT']]</query>
  </localfile>

  <syscheck>
    <directories check_all="yes" realtime="yes">C:\Program Files\Microsoft SQL Server\MSSQL\Binn</directories>
    <ignore type="sregex">\.mdf$|\.ndf$|\.ldf$|\.trc$</ignore>
  </syscheck>

  <!-- Журнал ошибок SQL Server в текстовом виде: часть событий
       не попадает в журнал приложений Windows. -->
  <localfile>
    <log_format>multi-line:2</log_format>
    <location>C:\Program Files\Microsoft SQL Server\MSSQL\Log\ERRORLOG</location>
  </localfile>

</agent_config>
