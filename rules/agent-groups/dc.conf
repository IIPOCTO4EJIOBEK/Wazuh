<!--
  Группа dc — контроллеры домена Active Directory.

  На контроллере домена собирается всё, что относится к аутентификации
  и изменению каталога, и дополнительно канал репликации: расхождение
  между контроллерами часто оказывается первым видимым следом
  вмешательства в каталог.

  Здесь же лежит скрипт блокировки учётной записи, который запускает
  active response по правилам 100330 и 100331. Поэтому агент на
  контроллере домена работает под учётной записью с правом отключать
  пользователей — см. docs/07-detection-response.md.
-->
<agent_config os="Windows">

  <localfile>
    <location>Directory Service</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>DFS Replication</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>DNS Server</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-DNSServer/Audit</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Расширенный набор событий каталога: сюда входят изменения
       объектов (5136-5141) и обращения к объектам каталога (4662),
       по которым видно DCSync. -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>
      Event/System[EventID=4662 or EventID=4670 or EventID=4741 or
      EventID=4742 or EventID=4743 or EventID=4764 or EventID=5136 or
      EventID=5137 or EventID=5138 or EventID=5139 or EventID=5141]
    </query>
  </localfile>

  <syscheck>
    <directories check_all="yes" realtime="yes">%WINDIR%\SYSVOL\domain\Policies</directories>
    <directories check_all="yes" realtime="yes">%WINDIR%\NTDS</directories>
    <ignore type="sregex">edb.*\.log$|\.jfm$|temp\.edb$</ignore>
  </syscheck>

</agent_config>
