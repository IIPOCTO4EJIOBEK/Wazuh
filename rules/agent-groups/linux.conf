<!--
  Группа linux — общая часть для всех серверов на Linux.
-->
<agent_config os="Linux">

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <!-- Журнал systemd: сюда попадают падения служб и OOM-killer,
       которых нет в текстовых журналах. -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <!-- Аудит ядра. Правила auditd раскладываются отдельно, см.
       docs/06-agents.md. -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Контроль целостности системных каталогов. realtime только там,
       где изменения редки: inotify на /usr/bin съедает дескрипторы. -->
  <syscheck>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>
    <directories check_all="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes" realtime="yes">/root/.ssh,/home/*/.ssh</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.d,/etc/cron.daily,/var/spool/cron</directories>

    <!-- Служебные файлы cron. Каждое изменение расписания cron пишет
         через временный файл tmp.XXXXXX: на выходе три события — файл
         создан, исходный изменён, временный удалён. Само расписание
         под контролем остаётся, временные файлы — шум.
         Замечено на пилоте, узел pbx1, 20.08.2026. -->
    <ignore type="sregex">/crontabs/tmp</ignore>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mnttab</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore type="sregex">\.log$|\.swp$</ignore>

    <!-- Каталоги, где изменения ожидаемы постоянно. -->
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>
  </syscheck>

  <!-- Периодические команды: свободное место и слушающие порты.
       Новый открытый порт на сервере — либо новый сервис, либо чужой. -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>ss -tulpnH</command>
    <alias>listening ports</alias>
    <frequency>600</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <alias>last logins</alias>
    <frequency>600</frequency>
  </localfile>

</agent_config>
