<!--
  Группа windows — общая часть для всех узлов на Windows.

  Каналы журналов выбраны так, чтобы покрыть аутентификацию, запуск
  процессов, PowerShell и работу Defender. Sysmon подключается
  отдельным каналом: если он не установлен, агент просто не найдёт
  канал и продолжит работу без него.

  Фильтры по идентификаторам событий заданы прямо в запросе канала.
  Это принципиально: канал Security на контроллере домена порождает
  тысячи событий в секунду, и передавать их целиком означает и
  перегрузить сеть, и утопить менеджер в шуме.
-->
<agent_config os="Windows">

  <!-- Безопасность: только те события, на которых построены правила
       100300–100399. Список сверен с ними; при добавлении правила
       не забыть добавить сюда идентификатор события. -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>
      Event/System[EventID=4624 or EventID=4625 or EventID=4634 or
      EventID=4648 or EventID=4656 or EventID=4663 or EventID=4672 or
      EventID=4688 or EventID=4697 or EventID=4719 or EventID=4720 or
      EventID=4722 or EventID=4723 or EventID=4724 or EventID=4725 or
      EventID=4726 or EventID=4728 or EventID=4732 or EventID=4738 or
      EventID=4740 or EventID=4756 or EventID=4767 or EventID=4768 or
      EventID=4769 or EventID=4771 or EventID=4776 or EventID=4964 or
      EventID=1102]
    </query>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[Level=1 or Level=2 or Level=3]</query>
  </localfile>

  <!-- PowerShell: блочная запись сценариев. Требует включения
       ScriptBlockLogging групповой политикой, см. docs/06-agents.md. -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4103 or EventID=4104]</query>
  </localfile>

  <localfile>
    <location>Windows PowerShell</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-TaskScheduler/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=106 or EventID=140 or EventID=141]</query>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-TerminalServices-LocalSessionManager/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Целостность: системные каталоги и точки автозапуска. -->
  <syscheck>
    <directories check_all="yes" realtime="yes">%WINDIR%\System32\drivers\etc</directories>
    <directories check_all="yes" realtime="yes">%WINDIR%\System32\wbem</directories>
    <directories check_all="yes" realtime="yes">%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>

    <!-- Корень %WINDIR% без вложенных каталогов (recursion_level="0").
         Файлы здесь не меняются годами, а положить исполняемый файл
         прямо в C:\Windows — обычный приём: так туда попал
         winexesvc.exe на pdc-hv0, и заметили его только сканером
         через месяц. Каталог маленький, наблюдение почти бесплатно. -->
    <directories check_all="yes" realtime="yes" recursion_level="0">%WINDIR%</directories>

    <!-- Каталоги, которые в штатной работе пусты либо содержат только
         временные файлы. Появление здесь исполняемого файла
         разбирается правилом 100521, записки вымогателя — 100520. -->
    <directories check_all="yes" realtime="yes">C:\PerfLogs</directories>
    <directories check_all="yes" realtime="yes">C:\Users\Public</directories>

    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Policies</windows_registry>

    <ignore type="sregex">.log$|.tmp$|.chk$</ignore>
  </syscheck>

  <!-- Список установленных обновлений: на нём строится отчёт
       по неустановленным исправлениям безопасности. -->
  <wodle name="syscollector">
    <hotfixes>yes</hotfixes>
  </wodle>

</agent_config>
