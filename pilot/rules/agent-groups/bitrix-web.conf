<!--
  Группа bitrix-web — web01 (10.0.1.220), web02 (10.0.1.221),
  b24-web-01 (10.0.2.31).

  Главная ценность на этих узлах — каталог /home/bitrix/www. Там лежат
  форма заявки, обработчики и журнал заявок с персональными данными
  сотрудников. Каталог доступен на запись учётной записи разработчика
  и группе bitrix, то есть подмена файла — реальный, а не гипотетический
  сценарий. Поэтому здесь realtime и report_changes: нужно видеть не
  только факт правки, но и что именно изменилось.
-->
<agent_config>

  <syscheck>
    <!-- Код портала: реальное время и запись различий.
         report_changes хранит копии файлов, поэтому включён только
         для каталога с исходниками, а не для всего www. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/home/bitrix/www</directories>

    <!-- Конфигурация PHP и веб-сервера -->
    <directories check_all="yes" realtime="yes">/etc/nginx,/etc/apache2,/etc/php</directories>

    <!-- Каталоги, которые меняются постоянно и в контроле не нуждаются -->
    <ignore>/home/bitrix/www/bitrix/cache</ignore>
    <ignore>/home/bitrix/www/bitrix/managed_cache</ignore>
    <ignore>/home/bitrix/www/bitrix/stack_cache</ignore>
    <ignore>/home/bitrix/www/bitrix/tmp</ignore>
    <ignore>/home/bitrix/www/upload</ignore>
    <ignore type="sregex">/bitrix/backup/</ignore>
    <ignore type="sregex">\.log$</ignore>

    <!-- Журнал заявок меняется штатно, но его содержимое —
         персональные данные. Фиксируем факт изменения, различия
         не сохраняем. -->
    <nodiff>/home/bitrix/www/zayavka_log.json</nodiff>
  </syscheck>

  <!-- Журналы веб-сервера -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/home/bitrix/log/nginx/*access.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/home/bitrix/log/nginx/*error.log</location>
  </localfile>

  <!-- Журнал PHP: фатальные ошибки часто первыми показывают
       неудачную попытку эксплуатации. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/php*-fpm.log</location>
  </localfile>

  <!-- Собственные журналы приложения заявок.
       Формат строк: см. rules/local_decoder.xml -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/home/bitrix/log/zayavka.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/home/bitrix/log/sdp-sync.log</location>
  </localfile>

  <!-- Список файлов портала с правами на запись для посторонних:
       регулярная проверка того, что перевыпуск прав не сломался. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>find /home/bitrix/www -maxdepth 2 -type f -perm -o+w -printf '%p %m %u:%g\n' | head -50</command>
    <alias>world writable files in www</alias>
    <frequency>3600</frequency>
  </localfile>

</agent_config>
