<!--
  Группа workstation — рабочие станции сотрудников.

  Профиль облегчённый: на рабочей станции важнее не пропустить
  вредоносное ПО и попытку закрепиться, а полный контроль целостности
  системных каталогов на трёхстах машинах создаёт поток событий,
  который никто не читает.

  Именно к этой группе применяется автоматическая изоляция узла
  (правила 100310–100312). На серверах изоляция не применяется:
  цена ложного срабатывания несопоставима.
-->
<agent_config os="Windows">

  <syscheck>
    <frequency>86400</frequency>
    <directories check_all="yes" realtime="yes">%USERPROFILE%\Downloads</directories>
    <directories check_all="yes" realtime="yes">%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes">%TEMP%</directories>
    <ignore type="sregex">\.tmp$|\.log$|\.etl$|\.dmp$</ignore>
  </syscheck>

  <!-- Ограничение потока с рабочей станции жёстче, чем у серверов:
       триста машин по 500 событий в секунду менеджер не переварит. -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>150</events_per_second>
  </client_buffer>

  <!-- Съёмные носители: подключение флеш-накопителя фиксируется
       и попадает в отчёт по требованиям к защите персональных данных. -->
  <localfile>
    <location>Microsoft-Windows-DriverFrameworks-UserMode/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=2003 or EventID=2100 or EventID=2102]</query>
  </localfile>

</agent_config>
