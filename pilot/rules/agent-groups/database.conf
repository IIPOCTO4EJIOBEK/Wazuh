<!--
  Группа database — узлы СУБД портала (10.1.17.120 primary, .121 replica).

  Отдельно контролируется расхождение репликации: незамеченный разрыв
  репликации означает, что резервная база устарела, и переключение на
  неё при отказе потеряет данные.
-->
<agent_config>

  <syscheck>
    <directories check_all="yes" realtime="yes">/etc/mysql,/etc/my.cnf.d</directories>
    <directories check_all="yes">/var/lib/mysql/mysql-bin.index</directories>
    <ignore type="sregex">/var/lib/mysql/.*\.(ibd|frm|MYD|MYI)$</ignore>
  </syscheck>

  <localfile>
    <log_format>mysql_log</log_format>
    <location>/var/log/mysql/error.log</location>
  </localfile>

  <localfile>
    <log_format>mysql_log</log_format>
    <location>/var/log/mysqld.log</location>
  </localfile>

  <!-- Медленные запросы: и производительность, и признак выгрузки
       больших объёмов данных. -->
  <localfile>
    <log_format>mysql_log</log_format>
    <location>/var/log/mysql/mysql-slow.log</location>
  </localfile>

  <!-- Состояние репликации. Строка Seconds_Behind_Master попадает
       в событие, правило ловит рост отставания. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>mysql --defaults-file=/etc/mysql/wazuh-monitor.cnf -e "SHOW REPLICA STATUS\G" 2>/dev/null | grep -E "Replica_IO_Running|Replica_SQL_Running|Seconds_Behind_Source|Last_Error"</command>
    <alias>mysql replication status</alias>
    <frequency>300</frequency>
  </localfile>

</agent_config>
