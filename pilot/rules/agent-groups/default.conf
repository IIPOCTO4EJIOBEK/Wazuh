<!--
  Группа default — конфигурация, общая для всех агентов независимо от ОС.
  Агент состоит в нескольких группах одновременно; настройки складываются,
  поэтому здесь только то, что нужно вообще всем.

  Файл раскладывается в /var/ossec/etc/shared/default/agent.conf на
  master-менеджере и расходится по агентам автоматически.
-->
<agent_config>

  <!-- Инвентарь: пакеты, порты, процессы, обновления. На нём же
       строится выявление уязвимостей — без инвентаря модуль CVE
       работать не может. -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <!-- Оценка конфигурации по стандартам CIS. Политики Wazuh подбирает
       под операционную систему сам. -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- Ограничение потока событий с одного агента.
       Без него один сломавшийся сервис на одной машине заливает
       менеджер и вытесняет события со всех остальных. -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>10000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Проверка целостности: базовые параметры, каталоги задаются
       в группах по ролям. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <max_eps>100</max_eps>
    <process_priority>10</process_priority>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
  </rootcheck>

</agent_config>
