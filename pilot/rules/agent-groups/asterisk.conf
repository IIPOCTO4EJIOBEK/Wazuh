<!--
  Группа asterisk — серверы телефонии Asterisk/FreePBX.

  Собираем журналы Asterisk, системные журналы и контролируем конфиги
  телефонии. Детальные правила под SIP/AMI/CEL можно расширять после
  появления первых реальных событий в пилоте.
-->
<agent_config os="Linux">

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/asterisk/full</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/asterisk/messages</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/asterisk/security</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/asterisk/fail2ban</location>
  </localfile>

  <syscheck>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/asterisk</directories>
    <directories check_all="yes" realtime="yes">/var/lib/asterisk/agi-bin,/var/spool/asterisk</directories>
    <ignore type="sregex">/var/spool/asterisk/(monitor|voicemail|tmp)/</ignore>
    <ignore type="sregex">\.(wav|gsm|mp3|call)$</ignore>
  </syscheck>

  <localfile>
    <log_format>full_command</log_format>
    <command>asterisk -rx "core show uptime" 2>/dev/null</command>
    <alias>asterisk uptime</alias>
    <frequency>300</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>asterisk -rx "sip show registry" 2>/dev/null || asterisk -rx "pjsip show registrations" 2>/dev/null</command>
    <alias>asterisk trunk registrations</alias>
    <frequency>300</frequency>
  </localfile>

</agent_config>
