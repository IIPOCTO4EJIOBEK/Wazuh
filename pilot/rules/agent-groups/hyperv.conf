<!--
  Группа hyperv — гипервизоры (pdc-hv0, 10.2.27.118).

  Набор каналов подобран по инциденту 09.06.2026: отказ массива
  FUJITSU ETERNUS_DXL проявился событиями драйвера диска, MPIO и
  файловой системы, а увидели его только постфактум по журналам.
  Теперь эти каналы читаются агентом в реальном времени и разбираются
  правилами 100410–100415.
-->
<agent_config os="Windows">

  <localfile>
    <location>Microsoft-Windows-Hyper-V-VMMS-Admin</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Hyper-V-Worker-Admin</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Hyper-V-StorageVSP-Admin</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-StorageSpaces-Driver/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-MultipathIO/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Ntfs/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Состояние физических дисков и томов. Опрос раз в 5 минут:
       чаще не нужно, реже — можно не успеть заметить деградацию
       до отказа. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>powershell -NoProfile -Command "Get-PhysicalDisk | Select-Object FriendlyName,HealthStatus,OperationalStatus | Format-Table -HideTableHeaders"</command>
    <alias>physical disk health</alias>
    <frequency>300</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>powershell -NoProfile -Command "Get-Volume | Where-Object DriveLetter | Select-Object DriveLetter,HealthStatus,@{n='FreeGB';e={[int]($_.SizeRemaining/1GB)}} | Format-Table -HideTableHeaders"</command>
    <alias>volume health</alias>
    <frequency>300</frequency>
  </localfile>

  <!-- Состояние виртуальных машин: незапланированное выключение
       машины должно быть видно сразу. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>powershell -NoProfile -Command "Get-VM | Select-Object Name,State,Status | Format-Table -HideTableHeaders"</command>
    <alias>virtual machine state</alias>
    <frequency>600</frequency>
  </localfile>

</agent_config>
