<!--
  Группа dmz — узлы на периметре: HAProxy (10.0.1.50) и Nginx Proxy
  Manager (10.0.1.110, внешний адрес 185.160.36.97).

  Это единственные узлы, которые видят трафик из интернета. Всё, что
  здесь происходит, попадает в SIEM без прореживания.
-->
<agent_config>

  <syscheck>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/haproxy</directories>
    <directories check_all="yes" realtime="yes">/etc/nginx,/data/nginx</directories>
    <directories check_all="yes" realtime="yes">/etc/letsencrypt/live</directories>
  </syscheck>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/haproxy.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/data/logs/*access*.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/data/logs/*error*.log</location>
  </localfile>

  <!-- Число установленных соединений: резкий рост — признак
       исчерпания пула или отказа в обслуживании. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -s | head -4</command>
    <alias>socket summary</alias>
    <frequency>300</frequency>
  </localfile>

  <!-- Срок действия сертификатов публикации. Просроченный сертификат
       на периметре — это отказ сервиса, который всегда происходит
       в выходные. -->
  <localfile>
    <log_format>full_command</log_format>
    <command>for c in /etc/letsencrypt/live/*/cert.pem; do echo "$c $(openssl x509 -enddate -noout -in $c)"; done</command>
    <alias>certificate expiry</alias>
    <frequency>86400</frequency>
  </localfile>

</agent_config>
