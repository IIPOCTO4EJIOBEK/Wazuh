# =====================================================================
#  Пересылка журналов Bitrix в приёмник Москвы.
#  Узлы: web01 (10.0.1.220), web02 (10.0.1.221), b24-web-01 (10.0.2.31)
#  Ответственный: Цеховской В.
#
#  Установка:
#      cp rsyslog-bitrix-forward.conf /etc/rsyslog.d/60-wazuh-forward.conf
#      rsyslogd -N1                    # проверка синтаксиса
#      systemctl restart rsyslog
#
#  Проверка, что доходит:
#      logger -t zayavka "zayavka: request=TEST user=test ip=10.0.1.1 action=create result=ok"
#      # на приёмнике: tail -f /var/ossec/logs/archives/archives.log | grep TEST
# =====================================================================

# --- Приёмник -------------------------------------------------------
# Адрес уточняется после выдачи ВМ (см. docs/14-pilot.md).
# TCP, а не UDP: UDP теряет события молча и подделывается кем угодно.
$WorkDirectory /var/spool/rsyslog

# Очередь на диске: при обрыве канала до Москвы события не теряются,
# а накапливаются и уходят после восстановления связи.
$ActionQueueFileName wazuhfwd
$ActionQueueMaxDiskSpace 2g
$ActionQueueSaveOnShutdown on
$ActionQueueType LinkedList
$ActionResumeRetryCount -1

# --- Что отправляем -------------------------------------------------
# Журналы веб-сервера читаются модулем imfile: они пишутся в файлы,
# а не в syslog.
module(load="imfile" PollingInterval="10")

input(type="imfile"
      File="/var/log/nginx/access.log"
      Tag="nginx-access"
      Severity="info"
      Facility="local5")

input(type="imfile"
      File="/var/log/nginx/error.log"
      Tag="nginx-error"
      Severity="error"
      Facility="local5")

input(type="imfile"
      File="/home/bitrix/log/nginx/*error.log"
      Tag="bitrix-nginx-error"
      Severity="error"
      Facility="local5")

# Журнал приложения заявок. Формат строк описан в
# docs/07-detection-response.md — его разбирает декодер zayavka.
input(type="imfile"
      File="/home/bitrix/log/zayavka.log"
      Tag="zayavka"
      Severity="info"
      Facility="local6")

input(type="imfile"
      File="/home/bitrix/log/sdp-sync.log"
      Tag="sdp-sync"
      Severity="info"
      Facility="local6")

# --- Куда --------------------------------------------------------------
# Системные журналы (auth, sudo, cron) и всё перечисленное выше.
# @@ означает TCP, одиночная @ — UDP; нужен именно двойной.
*.* @@10.3.251.40:514

# Локальную копию оставляем: пересылка не должна означать,
# что на самом узле журналов больше нет.
