---
# Агент Wazuh на Linux-узле.
#
# Регистрация идёт на VIP: агент, зарегистрированный напрямую на
# конкретном менеджере, после его отказа молча перестаёт слать события.

- name: Установка агента (Debian)
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_version }}-*"
    state: present
  environment:
    WAZUH_MANAGER: "{{ wazuh_vip_agents }}"
    WAZUH_REGISTRATION_SERVER: "{{ wazuh_vip_agents }}"
    WAZUH_REGISTRATION_PASSWORD: "{{ vault_agent_enrollment_password }}"
    WAZUH_AGENT_GROUP: "{{ wazuh_agent_groups | default('default') }}"
    WAZUH_AGENT_NAME: "{{ inventory_hostname }}"
  no_log: true
  when: ansible_os_family == 'Debian'

- name: Установка агента (RedHat)
  ansible.builtin.dnf:
    name: "wazuh-agent-{{ wazuh_version }}"
    state: present
  environment:
    WAZUH_MANAGER: "{{ wazuh_vip_agents }}"
    WAZUH_REGISTRATION_SERVER: "{{ wazuh_vip_agents }}"
    WAZUH_REGISTRATION_PASSWORD: "{{ vault_agent_enrollment_password }}"
    WAZUH_AGENT_GROUP: "{{ wazuh_agent_groups | default('default') }}"
    WAZUH_AGENT_NAME: "{{ inventory_hostname }}"
  no_log: true
  when: ansible_os_family == 'RedHat'

- name: Закрепление версии пакета (Debian)
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold
  when:
    - wazuh_pin_packages
    - ansible_os_family == 'Debian'

- name: Пароль регистрации
  ansible.builtin.copy:
    dest: /var/ossec/etc/authd.pass
    content: "{{ vault_agent_enrollment_password }}"
    owner: root
    group: wazuh
    mode: "0640"
  no_log: true

- name: Конфигурация агента
  ansible.builtin.template:
    src: ossec-agent.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0660"
    backup: true
  notify: restart wazuh-agent

- name: Служба агента запущена
  ansible.builtin.service:
    name: wazuh-agent
    state: started
    enabled: true

- name: Проверка регистрации
  ansible.builtin.stat:
    path: /var/ossec/etc/client.keys
  register: client_keys

- name: Агент зарегистрирован
  ansible.builtin.assert:
    that: client_keys.stat.exists and client_keys.stat.size > 0
    fail_msg: >-
      {{ inventory_hostname }}: client.keys пуст — регистрация не прошла.
      Проверить доступность {{ wazuh_vip_agents }}:{{ manager_enrollment_port }}
      и пароль регистрации.

- name: Ожидание подключения к менеджеру
  ansible.builtin.shell:
    cmd: grep -c "Connected to the server" /var/ossec/logs/ossec.log || true
  register: connected
  changed_when: false
  retries: 6
  delay: 10
  until: connected.stdout | int > 0
