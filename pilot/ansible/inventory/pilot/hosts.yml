---
# =====================================================================
#  Инвентарь ПИЛОТА. Одна машина, отказоустойчивости нет — сознательно.
#
#  Задача пилота: убедиться, что события Active Directory и Bitrix
#  доходят, разбираются правилами и дают осмысленную картину. Проверять
#  это на кластере из девяти машин незачем: топология на состав правил
#  не влияет, а сроки согласования железа — влияют.
#
#  Отказоустойчивая схема: inventory/hosts.yml.
#  Переход с пилота на неё описан в docs/14-pilot.md.
#
#  Запуск:
#      ansible-playbook -i inventory/pilot/hosts.yml site.yml --ask-vault-pass
#
#  Адрес машины пилота: 10.17.1.252.
# =====================================================================

all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
    wazuh_content_dir: "{{ inventory_dir }}/../../.."
    wazuh_vip_agents: "10.17.1.252"
    wazuh_vip_dashboard: "10.17.1.252"
    wazuh_agents_fqdn: "10.17.1.252"
    wazuh_dashboard_fqdn: "10.17.1.252"
    dashboard_server_name: "10.17.1.252"
    indexer_alerts_shards: 1
    indexer_alerts_replicas: 0
    indexer_heap_size: "6g"
    ism_hot_days: 3
    ism_warm_days: 14
    ism_cold_days: 45
    ism_delete_days: 90
    syslog_reception_enabled: true
    syslog_port: 514
    syslog_protocol: tcp
    snapshot_verify_on_deploy: false
    offsite_enabled: true
    config_backup_keep_days: 30
    servicedesk_enabled: false
    smtp_enabled: true
    zabbix_enabled: true
    wazuh_rules_selftest: true

  children:

    # -----------------------------------------------------------------
    # Один узел во всех ролях сразу: индексер, менеджер, дашборд.
    # Роли не конфликтуют — они слушают разные порты и работают под
    # разными учётными записями.
    # -----------------------------------------------------------------
    wazuh_indexer:
      hosts:
        wazush:
          ansible_host: 10.17.1.252
          ansible_connection: local
          indexer_node_name: wazush
          wazuh_content_dir: "{{ inventory_dir }}/../../.."
          wazuh_vip_agents: "10.17.1.252"
          wazuh_vip_dashboard: "10.17.1.252"
          wazuh_agents_fqdn: "10.17.1.252"
          wazuh_dashboard_fqdn: "10.17.1.252"
          dashboard_server_name: "10.17.1.252"
          indexer_alerts_shards: 1
          indexer_alerts_replicas: 0
          indexer_heap_size: "6g"
          ism_hot_days: 3
          ism_warm_days: 14
          ism_cold_days: 45
          ism_delete_days: 90
          syslog_reception_enabled: true
          syslog_port: 514
          syslog_protocol: tcp
          snapshot_verify_on_deploy: false
          offsite_enabled: true
          config_backup_keep_days: 30
          servicedesk_enabled: false
          smtp_enabled: true
          zabbix_enabled: true
          wazuh_rules_selftest: true

    wazuh_manager:
      hosts:
        wazush:
          ansible_host: 10.17.1.252
          manager_node_name: wazush
          manager_node_type: master

    wazuh_manager_master:
      hosts:
        wazush:
          ansible_host: 10.17.1.252

    wazuh_dashboard:
      hosts:
        wazush:
          ansible_host: 10.17.1.252

    # Балансировщиков в пилоте нет: одну машину балансировать не между
    # чем. Группа объявлена пустой, чтобы плейбуки не искали её.
    wazuh_lb:
      hosts: {}

    # -----------------------------------------------------------------
    # Источники событий пилота.
    #
    # Контроллеры домена: агент ставится на две машины — это несравнимо
    # с раскаткой на 400 и сохраняет работу правил 100300–100399,
    # которым нужны поля журнала Windows. Если принято решение идти
    # только через syslog, см. docs/14-pilot.md, раздел о потере полей.
    # -----------------------------------------------------------------
    wazuh_agents_linux:
      children:
        agents_bitrix:
          hosts:
            web01:
              ansible_host: 10.0.1.220
            web02:
              ansible_host: 10.0.1.221
          vars:
            wazuh_agent_groups: "default,linux,bitrix-web"

        agents_asterisk:
          hosts:
            asterisk-01:
              ansible_host: 10.1.10.111
              ansible_user: vardo001
          vars:
            wazuh_agent_groups: "default,linux,asterisk"
